<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tcc</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>


    <aside class="menu-lateral">

        <div class="logo">☰</div>

        <div class="user-area">
            <div class="user-image"></div>
            <div class="user-info">
                <h3>Larissa</h3>
                <p>Usuário</p>
            </div>

            <button class="settings">⚙</button>
        </div>

    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-button">☰</button>
        </header>

        <section class="content">
            <div class="chat-container">

                <div class="chat-box">
                    <div class="message ia">
                        Olá sou Yana!, como posso ajudar?
                    </div>

                    <div class="message user">
                        Me explique a diferença de while e for.
                    </div>
                </div>

                <div class="chat-input">
                    Digite sua mensagem...
                </div>

            </div>

            <div class="code-container">

                <div class="terminal">
                    
                    <p>TERMINAL</p>
                    <textarea id="terminal"></textarea>
                </div>
                

                <div class="feedback">
                    <p>Resultado do código...</p>
                    <textarea id="feedback"></textarea>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
