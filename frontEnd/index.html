<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tcc</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>


    <aside class="menu-lateral" id="menu-lateral">

        <div class="logo" onclick="abrirMenu()">☰</div>

        <div class="user-area">
            <div class="user-image"></div>
            <div class="user-info">
                <h3>Larissa</h3>
                <p>Usuário</p>
            </div>

            <button class="settings" aria-label="Configurações">⚙</button>
        </div>

    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="menu-button" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
        </header>

        <section class="content">
            <div class="chat-container">

                <div class="chat-box" id="chat-box">
                    <div class="message ia">Olá sou Yana!, como posso ajudar?</div>

                    <div class="message user">Me explique a diferença de while e for.</div>
                </div>

                <button class="raposa" id="raposa" type="button" aria-label="Raposa mascote. Clique para fazer carinho.">
                    <img id="raposa-imagem" src="./assets/img/raposa/sentada.png" alt="" width="300" height="219">
                </button>

                <div class="chat-input">
                    <input type="text" id="message-input" placeholder="Digite sua mensagem..." autocomplete="off">

                    <button type="button" id="botao-enviar" onclick="enviarMensagem()">
                        Enviar
                    </button>
                </div>

            </div>

            <nav class="menu-superior">
                <div class="elementos">
                    <ul>
                        <li><a href="#">LOGO</a></li>
                        <li>NOME DO SITE</li>
                    </ul>
                </div>


            </nav>

            <div class="code-container">

                <div class="terminal">

                    <p>TERMINAL</p>
                    <textarea id="terminal" spellcheck="false" autocomplete="off"></textarea>
                </div>


                <div class="feedback">
                    <p>Resultado do código...</p>
                    <textarea id="feedback" spellcheck="false"></textarea>
                </div>

            </div>
        </section>
    </main>

    <script src="./js/chat.js"></script>
    <script src="./js/raposa.js"></script>
</body>

</html>
